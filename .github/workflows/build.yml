name: Build

on:
  # workflow_dispatch:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: supplypike/setup-bin@v5
        with:
          uri: "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-aarch64-linux.tar.gz"
          name: "wasm-opt"
          version: "130"
          subPath: "binaryen-version_130/bin"

      - name: Show version information (Rust, cargo)
        run: |
          rustup update stable
          rustup -V
          rustup toolchain list
          rustup target add wasm32-unknown-unknown
          cargo -V
          rustc -V
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - uses: taiki-e/install-action@v2
        with:
          tool: worker-build,wasm-bindgen
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          WASM_BINDGEN_BIN: /home/runner/.cargo/bin/wasm-bindgen
